name: Accuracy V2 CI

on:
  push:
    branches:
      - feature/accuracy-v2
  pull_request:
    paths:
      - "music_agent/**"
      - "main.py"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/accuracy-v2.yml"

permissions:
  contents: read

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q main.py music_agent scripts tests
      - name: Test chord symbols
        run: python -m unittest tests.test_chord_symbol -v
      - name: Test beat grid
        run: python -m unittest tests.test_beat_grid -v
      - name: Test sequence optimizer
        run: python -m unittest tests.test_sequence_optimizer -v
      - name: Test consensus
        run: python -m unittest tests.test_consensus -v
      - name: Test repeated motif reconciliation
        run: python -m unittest tests.test_motif_reconcile -v
      - name: Test structure refinement
        run: python -m unittest tests.test_structure_refine -v
      - name: Test final Accuracy V2 reconciliation
        run: python -m unittest tests.test_accuracy_v2_finalization -v
      - name: Test release recovery regressions
        run: python -m unittest tests.test_accuracy_v2_release_recovery -v
      - name: Test static-section quality gate
        run: python -m unittest tests.test_quality_extension -v
      - name: Test validators
        run: python -m unittest tests.test_validators -v
      - name: Test structured response gateway
        run: python -m unittest tests.test_model_gateway -v
      - name: Test mandatory model failure gates
        run: python -m unittest tests.test_required_model_failures -v
      - name: Test review snapshot rebuild
        run: python -m unittest tests.test_review_rebuilder -v
      - name: Test media sources
        run: python -m unittest tests.test_media_source -v
      - name: Test model output recovery
        run: python -m unittest tests.test_model_output_recovery -v
      - name: Test reference research
        run: python -m unittest tests.test_reference_research -v
      - name: Test reference attribution
        run: python -m unittest tests.test_reference_attribution -v
      - name: Test script entrypoints
        run: python -m unittest tests.test_script_entrypoints -v
      - name: Test API compatibility
        run: python -m unittest tests.test_api_compatibility -v
      - name: Test pipeline orchestration
        run: python -m unittest tests.test_pipeline_v2 -v
      - name: Run complete test discovery
        run: python -m unittest discover -s tests -v
      - name: Validate dependency graph
        run: python -m pip check
      - name: Validate shell scripts
        run: |
          bash -n deploy.sh
          bash -n local_run.sh
