name: Accuracy V2 CI

on:
  push:
    branches:
      - feature/accuracy-v2
  pull_request:
    paths:
      - "music_agent/**"
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/accuracy-v2.yml"

permissions:
  contents: read

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q main.py music_agent tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate dependency graph
        run: python -m pip check
      - name: Validate shell scripts
        run: |
          bash -n deploy.sh
          bash -n local_run.sh
